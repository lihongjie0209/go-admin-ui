name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  quality:
    name: Unit, type, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Unit tests
        run: pnpm run test:unit

      - name: Typecheck
        run: pnpm run check:type

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:antd
