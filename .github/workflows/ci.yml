name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  quality:
    name: Unit, type, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Checkout backend OpenAPI contract
        uses: actions/checkout@v7
        with:
          repository: lihongjie0209/go-api-template
          path: .backend-contract

      - name: Verify backend API has a frontend owner
        run: pnpm run check:api-coverage -- .backend-contract/docs/swagger.json

      - name: Reject legacy backend references
        shell: bash
        run: |
          if git grep -IinE 's[u]pabase|@[s]upabase|s[u]pabase-js'; then
            echo 'Legacy backend reference detected.' >&2
            exit 1
          fi

      - name: Unit tests
        run: pnpm run test:unit

      - name: Typecheck
        run: pnpm run check:type

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build:antd

  browser:
    name: Platform browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run platform browser tests
        run: pnpm run test:e2e:platform
